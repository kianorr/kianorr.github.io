<div class="gallery-lightbox" id="galleryLightbox">
  <img id="lightboxImg" src="" alt="" data-desc="" data-location="" />
  <div class="galler-lightbox-text" id="lightboxText">
    <div class="gallery-lightbox-caption" id="lightboxCaption"></div> 
    <div class="gallery-lightbox-location" id="lightboxLocation"></div>
    <div class="gallery-lightbox-film" id="lightboxFilm"></div>
  </div>
</div>
<script>
  const lightbox = document.getElementById('galleryLightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxCap = document.getElementById('lightboxCaption');
  const lightboxLoc = document.getElementById('lightboxLocation');
  const lightboxFilm = document.getElementById('lightboxFilm');
//   lightboxCap.innerHTML = "test";

  document.querySelectorAll('.gallery-item img').forEach(img => {
    img.style.cursor = 'zoom-in';
    img.addEventListener('click', () => {
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
    //   lightboxImg.desc = img.desc;
      lightboxCap.innerHTML = img.dataset.desc;
    //   lightboxCap.innerHTML = img.dataset.desc + '<br>' + img.dataset.location;
      lightboxLoc.innerHTML = img.dataset.location;
      lightboxFilm.innerHTML = img.dataset.film;
      lightbox.classList.add('active');
    });
  });

  lightbox.addEventListener('click', () => lightbox.classList.remove('active'));

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') lightbox.classList.remove('active');
  });
</script>
